name: Build VoiceInk (Local)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-voiceink.yml"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache VoiceInk dependencies
        uses: actions/cache@v4
        with:
          path: ~/VoiceInk-Dependencies
          key: macos26-voiceink-deps-${{ hashFiles('Makefile') }}
          restore-keys: |
            macos26-voiceink-deps-

      - name: Build VoiceInk
        run: make local LOCAL_CODESIGN_IDENTITY=-

      - name: Package app
        run: |
          test -d "$HOME/Downloads/VoiceInk.app"
          ditto -c -k --sequesterRsrc --keepParent             "$HOME/Downloads/VoiceInk.app"             "$GITHUB_WORKSPACE/VoiceInk.app.zip"
          ls -lh "$GITHUB_WORKSPACE/VoiceInk.app.zip"

      - name: Upload VoiceInk
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-macOS
          path: VoiceInk.app.zip
          if-no-files-found: error
          retention-days: 14
